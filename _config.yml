# GitHub Pages builds xenia-platform.github.io from this, with the docs
# tools/site.sh copies next to it. Links between the .md files become links
# between the pages; heading ids are made as on GitHub.
title: xenia
description: A web server and reverse proxy configured in JavaScript
theme: jekyll-theme-primer
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-default-layout
relative_links:
  enabled: true
